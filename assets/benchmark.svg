<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1414" viewBox="0 0 960 1414" font-family="'Segoe UI', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="959" height="1413" rx="14" fill="#ffffff" stroke="#e5e7eb"/><text x="40" y="66" font-size="28" font-weight="700" fill="#111827">Sidehand benchmark</text><text x="40" y="94" font-size="15" fill="#6b7280">Same Windows 11 PC. The task on the real desktop while typing in a note; app reads on the hidden test desktop</text><line x1="40" y1="132" x2="920" y2="132" stroke="#e5e7eb"/><text x="40" y="166" font-size="19" font-weight="700" fill="#111827">Your keyboard stays in your note</text><text x="40" y="188" font-size="13.5" fill="#6b7280">Real desktop, the same order form behind your note: seconds your note had no keyboard. Lower is better</text><text x="920" y="170" font-size="24" font-weight="800" text-anchor="end" fill="#2563eb">only one at 0 s</text><text x="40" y="225.04" font-size="15" font-weight="700" fill="#111827">Sidehand</text><rect x="250" y="206" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="206" width="4.0" height="28" rx="6" fill="#2563eb"/><text x="264.0" y="225.04" font-size="15" font-weight="700" text-anchor="start" fill="#1d4ed8">0.0 s</text><text x="40" y="265.04" font-size="15" font-weight="400" fill="#111827">agent-desktop 1.0.2</text><rect x="250" y="246" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="246" width="22.7" height="28" rx="6" fill="#9ca3af"/><text x="282.7" y="265.04" font-size="15" font-weight="400" text-anchor="start" fill="#374151">2.3 s, 4 windows came to the front</text><text x="40" y="305.04" font-size="15" font-weight="400" fill="#111827">Windows-MCP 0.8.8</text><rect x="250" y="286" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="286" width="490.4" height="28" rx="6" fill="#9ca3af"/><text x="728.4" y="305.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">49.7 s, 1 window came to the front, cursor moved 6x</text><text x="40" y="345.04" font-size="15" font-weight="400" fill="#111827">Terminator 0.24.28</text><rect x="250" y="326" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="326" width="670.0" height="28" rx="6" fill="#9ca3af"/><text x="908.0" y="345.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">67.9 s, 8 windows came to the front, cursor moved 2x</text><line x1="40" y1="374" x2="920" y2="374" stroke="#e5e7eb"/><text x="40" y="408" font-size="19" font-weight="700" fill="#111827">The same task: fill in and submit the order form</text><text x="40" y="430" font-size="13.5" fill="#6b7280">Read, 4 fields, submit, check the result, the way each tool's instructions say. Lower is better</text><text x="920" y="412" font-size="24" font-weight="800" text-anchor="end" fill="#2563eb">fastest, and done</text><text x="40" y="467.04" font-size="15" font-weight="700" fill="#111827">Sidehand</text><rect x="250" y="448" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="448" width="19.7" height="28" rx="6" fill="#2563eb"/><text x="279.7" y="467.04" font-size="15" font-weight="700" text-anchor="start" fill="#1d4ed8">2.0 s, done</text><text x="40" y="507.04" font-size="15" font-weight="400" fill="#111827">agent-desktop 1.0.2</text><rect x="250" y="488" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="488" width="26.6" height="28" rx="6" fill="#9ca3af"/><text x="286.6" y="507.04" font-size="15" font-weight="400" text-anchor="start" fill="#374151">2.7 s, region not set</text><text x="40" y="547.04" font-size="15" font-weight="400" fill="#111827">Windows-MCP 0.8.8</text><rect x="250" y="528" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="528" width="645.4" height="28" rx="6" fill="#9ca3af"/><text x="883.4" y="547.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">65.5 s, done</text><text x="40" y="587.04" font-size="15" font-weight="400" fill="#111827">Terminator 0.24.28</text><rect x="250" y="568" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="568" width="670.0" height="28" rx="6" fill="#9ca3af"/><text x="908.0" y="587.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">68.0 s, done</text><line x1="40" y1="616" x2="920" y2="616" stroke="#e5e7eb"/><text x="40" y="650" font-size="19" font-weight="700" fill="#111827">Tokens for that task</text><text x="40" y="672" font-size="13.5" fill="#6b7280">Everything the agent had to read. Windows-MCP reads every window on the desktop. Lower is better</text><text x="920" y="654" font-size="24" font-weight="800" text-anchor="end" fill="#2563eb">9x fewer</text><text x="40" y="709.04" font-size="15" font-weight="700" fill="#111827">Sidehand</text><rect x="250" y="690" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="690" width="13.8" height="28" rx="6" fill="#2563eb"/><text x="273.8" y="709.04" font-size="15" font-weight="700" text-anchor="start" fill="#1d4ed8">277</text><text x="40" y="749.04" font-size="15" font-weight="400" fill="#111827">agent-desktop 1.0.2</text><rect x="250" y="730" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="730" width="170.2" height="28" rx="6" fill="#9ca3af"/><text x="430.2" y="749.04" font-size="15" font-weight="400" text-anchor="start" fill="#374151">3,411</text><text x="40" y="789.04" font-size="15" font-weight="400" fill="#111827">Windows-MCP 0.8.8</text><rect x="250" y="770" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="770" width="670.0" height="28" rx="6" fill="#9ca3af"/><text x="908.0" y="789.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">13,425</text><text x="40" y="829.04" font-size="15" font-weight="400" fill="#111827">Terminator 0.24.28</text><rect x="250" y="810" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="810" width="124.2" height="28" rx="6" fill="#9ca3af"/><text x="384.2" y="829.04" font-size="15" font-weight="400" text-anchor="start" fill="#374151">2,488</text><line x1="40" y1="858" x2="920" y2="858" stroke="#e5e7eb"/><text x="40" y="892" font-size="19" font-weight="700" fill="#111827">Tokens to read 7 real apps</text><text x="40" y="914" font-size="13.5" fill="#6b7280">WinForms, WPF, order form, Character Map, System Information, Edge, VS Code. Lower is better</text><text x="920" y="896" font-size="24" font-weight="800" text-anchor="end" fill="#2563eb">5.6x fewer</text><text x="40" y="951.04" font-size="15" font-weight="700" fill="#111827">Sidehand</text><rect x="250" y="932" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="932" width="120.4" height="28" rx="6" fill="#2563eb"/><text x="380.4" y="951.04" font-size="15" font-weight="700" text-anchor="start" fill="#1d4ed8">4,476</text><text x="40" y="991.04" font-size="15" font-weight="400" fill="#111827">agent-desktop 1.0.2</text><rect x="250" y="972" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="972" width="670.0" height="28" rx="6" fill="#9ca3af"/><text x="908.0" y="991.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">24,898</text><line x1="40" y1="1020" x2="920" y2="1020" stroke="#e5e7eb"/><text x="40" y="1054" font-size="19" font-weight="700" fill="#111827">Time to read a window</text><text x="40" y="1076" font-size="13.5" fill="#6b7280">Average over the same 7 apps; Sidehand was faster on every one. Lower is better</text><text x="920" y="1058" font-size="24" font-weight="800" text-anchor="end" fill="#2563eb">1.8x faster</text><text x="40" y="1113.04" font-size="15" font-weight="700" fill="#111827">Sidehand</text><rect x="250" y="1094" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="1094" width="371.9" height="28" rx="6" fill="#2563eb"/><text x="609.9" y="1113.04" font-size="15" font-weight="700" text-anchor="end" fill="#ffffff">605 ms</text><text x="40" y="1153.04" font-size="15" font-weight="400" fill="#111827">agent-desktop 1.0.2</text><rect x="250" y="1134" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="1134" width="670.0" height="28" rx="6" fill="#9ca3af"/><text x="908.0" y="1153.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">1090 ms</text><line x1="40" y1="1182" x2="920" y2="1182" stroke="#e5e7eb"/><text x="40" y="1216" font-size="19" font-weight="700" fill="#111827">Install size</text><text x="40" y="1238" font-size="13.5" fill="#6b7280">Lower is better</text><text x="920" y="1220" font-size="24" font-weight="800" text-anchor="end" fill="#2563eb">230x smaller</text><text x="40" y="1275.04" font-size="15" font-weight="700" fill="#111827">Sidehand</text><rect x="250" y="1256" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="1256" width="4.0" height="28" rx="6" fill="#2563eb"/><text x="264.0" y="1275.04" font-size="15" font-weight="700" text-anchor="start" fill="#1d4ed8">135 KB</text><text x="40" y="1315.04" font-size="15" font-weight="400" fill="#111827">Cua Driver 0.28.2</text><rect x="250" y="1296" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="1296" width="670.0" height="28" rx="6" fill="#9ca3af"/><text x="908.0" y="1315.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">31 MB</text><text x="40" y="1355.04" font-size="15" font-weight="400" fill="#111827">agent-desktop 1.0.2</text><rect x="250" y="1336" width="670" height="28" rx="6" fill="#f3f4f6"/><rect x="250" y="1336" width="626.8" height="28" rx="6" fill="#9ca3af"/><text x="864.8" y="1355.04" font-size="15" font-weight="400" text-anchor="end" fill="#ffffff">29 MB</text></svg>
